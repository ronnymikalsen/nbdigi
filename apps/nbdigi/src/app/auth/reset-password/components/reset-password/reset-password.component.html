<div fxFill fxLayout="column" fxLayoutAlign="center center">
  <a routerLink="/home"
    ><mat-icon class="mat-display-medium logo" svgIcon="logo"></mat-icon
  ></a>
  <div class="mat-display-large">NBDIGI</div>
  <div class="mat-display-medium">Tilbakestill passord</div>
  <form
    class="reset-password-form"
    [formGroup]="resetPasswordForm"
    (ngSubmit)="resetPassword()"
    novalidate
  >
    <div fxLayout="column">
      <mat-form-field>
        <input
          type="text"
          matInput
          formControlName="email"
          placeholder="E-post"
        />
        @if (email.errors?.['userNotFound']) {
        <mat-error>Finner ikke bruker</mat-error>
        } @if (email.errors?.['invalidEmail']) {
        <mat-error>Ugyldig e-post</mat-error>
        }
      </mat-form-field>
      <button
        type="submit"
        mat-raised-button
        color="primary"
        [disabled]="resetPasswordForm.pristine || !resetPasswordForm.valid"
      >
        Send
      </button>
    </div>
  </form>
</div>
