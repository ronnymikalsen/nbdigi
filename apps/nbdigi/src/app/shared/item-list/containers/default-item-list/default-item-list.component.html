<button
  mat-list-item
  type="button"
  lines="3"
  class="item-list-entry"
  [attr.aria-label]="'Åpne ' + item.title"
  (click)="open(item)"
>
  <img
    matListItemAvatar
    class="thumbnail"
    [lazyLoad]="item.thumbnail"
    alt=""
  />

  <span matListItemTitle class="title" [matTooltip]="item.title">{{
    item.title
  }}</span>

  <span matListItemLine class="creator" [matTooltip]="item.creator">{{
    item.creator
  }}</span>

  <span matListItemLine class="details">
    @if (config.showMediaType && item.mediaType) {
    <span class="media-type" [matTooltip]="item.mediaType">{{
      item.mediaType
    }}</span>
    } @if (item.issued) {
    <span [matTooltip]="item.issued">{{ item.issued | dateFormat }}</span>
    }
  </span>

  @if (isDebugOn | async) {
  <span matListItemMeta class="debug-meta">
    <nbd-debug [isDebugOn]="true" [item]="item"></nbd-debug>
  </span>
  }
</button>

<mat-divider inset></mat-divider>
