<div class="item-details-container">
  @if (!(loading$ | async)) { @if (item$ | async; as item) {
  <mat-card class="item-details-card" appearance="outlined">
    <mat-card-content class="item-details-card__content">
      <div class="close">
        <nbd-item-menu-button
          [item]="item"
          [config]="config"
        ></nbd-item-menu-button>
        <button mat-icon-button (click)="close()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <div class="head">
        <nbd-item-details-head [item]="item"></nbd-item-details-head>
      </div>
      <mat-divider></mat-divider>
      <div class="metadata">
        <nbd-item-details-metadata
          [manifest]="manifest$ | async"
        ></nbd-item-details-metadata>
      </div>
    </mat-card-content>
  </mat-card>
  } }
</div>
