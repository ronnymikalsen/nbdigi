<button mat-icon-button [matMenuTriggerFor]="menu">
  @switch (config.direction) { @case ('horiz') {
  <mat-icon>more_horiz</mat-icon>
  } @default {
  <mat-icon>more_vert</mat-icon>
  } }
</button>
<mat-menu #menu="matMenu">
  @if (config.enableOpen) {
  <button mat-menu-item (click)="open()">
    <mat-icon>open_in_browser</mat-icon>
    <span>Les</span>
  </button>
  } @if (config.enableShowDetails) {
  <button mat-menu-item (click)="openItemDetails()">
    <mat-icon>info</mat-icon>
    <span>Detailjer</span>
  </button>
  }
  <button mat-menu-item (click)="addToFavorites()">
    <mat-icon>playlist_add</mat-icon>
    <span>Legg til i liste</span>
  </button>
  @if (list) {
  <button mat-menu-item (click)="removeFromFavorites()">
    <mat-icon>delete</mat-icon>
    <span>Fjern fra listen</span>
  </button>
  }
</mat-menu>
