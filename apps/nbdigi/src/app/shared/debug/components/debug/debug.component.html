@if (isDebugOn) {
<div
  class="debug-container"
  fxLayout="row"
  fxLayoutAlign="start center"
  (click)="$event.stopPropagation()"
>
  <a
    class="debug"
    [href]="item?.selfLink ? $safeNavigationMigration(item?.selfLink) : href"
    target="_blank"
    matTooltip="api"
  >
    <div><mat-icon>link</mat-icon></div>
  </a>
  @if (item) {
  <div class="debug" matTooltip="ID" (click)="openIds($event)">
    <mat-icon>vpn_key</mat-icon>
  </div>
  }
</div>
}
