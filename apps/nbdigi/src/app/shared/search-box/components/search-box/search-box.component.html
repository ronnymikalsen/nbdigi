<div
  id="searchbox-container"
  fxFill
  fxLayout="row"
  fxLayoutAlign="start center"
  fxLayoutGap="16px"
>
  <div fxFlex="100" fxFlex.gt-sm="700px">
    <form
      class="search-form"
      [formGroup]="searchForm"
      (ngSubmit)="onSubmit()"
      novalidate
    >
      <mat-form-field color="accent">
        <button
          matIconPrefix
          type="submit"
          mat-icon-button
          aria-label="Søk"
        >
          <mat-icon class="input-icon">search</mat-icon>
        </button>
        <button
          matIconSuffix
          type="button"
          mat-icon-button
          aria-label="Tøm søk"
          matTooltip="Dobbeltklikk for å nullstille hele søket"
          (click)="clear()"
          (dblclick)="onClearAll()"
        >
          <mat-icon class="input-icon">clear</mat-icon>
        </button>
        <input
          type="text"
          aria-label="Søk"
          matInput
          [formControl]="queryControl"
          [matAutocomplete]="auto"
          tabindex="1"
        />
        <mat-autocomplete
          #auto="matAutocomplete"
          [displayWith]="displayFn"
          (optionSelected)="optionSelected($event)"
        >
          @for (hint of hints?.creators; track hint) {
          <mat-option [value]="hint">
            <div fxLayout="row" fxLayoutAlign="start center">
              <mat-icon>{{ hint.type }}</mat-icon>
              <div>{{ hint.label }}</div>
            </div>
          </mat-option>
          } @for (hint of hints?.places; track hint) {
          <mat-option [value]="hint">
            <div fxLayout="row" fxLayoutAlign="start center">
              <mat-icon>{{ hint.type }}</mat-icon>
              <div>{{ hint.label }}</div>
            </div>
          </mat-option>
          }
        </mat-autocomplete>
      </mat-form-field>
    </form>
  </div>
</div>
