<h2 mat-dialog-title>Lag ny liste</h2>
<form
  class="add-list-form"
  [formGroup]="listForm"
  (ngSubmit)="addList($event)"
  novalidate
>
  <mat-dialog-content>
    <mat-form-field>
      <mat-label>Navn</mat-label>
      <input #listname matInput formControlName="listName" autocomplete="off" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelSelected.emit()">
      Avbryt
    </button>
    <button mat-button type="submit">Lagre</button>
  </mat-dialog-actions>
</form>
