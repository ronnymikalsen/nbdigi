@if (!showCreate) {
<div fxLayout="column">
  <h3>Legg til i liste</h3>
  <mat-nav-list>
    @for (favorite of favoriteLists | async; track favorite) {
    <mat-list-item (click)="addToList(favorite)">
      {{ favorite.name }}
    </mat-list-item>
    }
  </mat-nav-list>
  <div
    class="actions"
    fxLayout="row"
    fxLayoutAlign="end center"
    fxLayoutGap="10px"
  >
    <button mat-button mat-dialog-close>Avbryt</button>
    <button mat-button (click)="toggleCreate()">Lag ny liste</button>
  </div>
</div>
} @if (showCreate) {
<nbd-create-favorite-list
  (cancelSelected)="toggleCreate()"
  (listNameSelected)="addList($event)"
></nbd-create-favorite-list>
}
