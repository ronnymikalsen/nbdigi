@if (!showCreate) {
<h2 mat-dialog-title>Legg til i liste</h2>
<mat-dialog-content>
  <mat-action-list aria-label="Velg liste">
    @for (favorite of favoriteLists | async; track favorite.id) {
    <button mat-list-item type="button" (click)="addToList(favorite)">
      <span matListItemTitle>{{ favorite.name }}</span>
    </button>
    }
  </mat-action-list>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Avbryt</button>
  <button mat-button (click)="toggleCreate()">Lag ny liste</button>
</mat-dialog-actions>
} @else {
<nbd-create-favorite-list
  (cancelSelected)="toggleCreate()"
  (listNameSelected)="addList($event)"
></nbd-create-favorite-list>
}
