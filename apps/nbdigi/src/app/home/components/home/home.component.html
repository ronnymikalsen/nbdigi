<section class="home-intro" aria-labelledby="ai-search-title">
  <mat-card class="ai-search-card" appearance="outlined">
    <mat-card-content class="ai-search-content">
      <div class="ai-search-copy">
        <div class="ai-search-label">
          <mat-icon aria-hidden="true">chat</mat-icon>
          <span>KI-søk</span>
          <mat-chip-set aria-label="Ny funksjon"
            ><mat-chip>Nyhet</mat-chip></mat-chip-set
          >
        </div>
        <h1 id="ai-search-title">Finn bilder, bøker og mer med egne ord</h1>
        <p>Beskriv hva du leter etter, og avgrens søket videre i samtalen.</p>
        <p class="ai-search-example">
          Prøv «Vis bilder og bøker om hunder», og følg opp med «Bare etter
          2000».
        </p>
      </div>
      <a mat-flat-button class="ai-search-link" routerLink="/ai-search">
        Prøv KI-søk
        <mat-icon iconPositionEnd aria-hidden="true">arrow_forward</mat-icon>
      </a>
    </mat-card-content>
  </mat-card>
</section>
<mat-toolbar class="search-toolbar">
  <nbd-search-box
    [showAiSearchLink]="false"
    fxFlex="100"
    (searchSelected)="searchSelected.emit($event)"
  ></nbd-search-box>
</mat-toolbar>
<div class="drawer-container">
  <mat-drawer-container>
    <mat-drawer
      appItemDetailsDrawer
      autosize="true"
      mode="side"
      position="end"
      [opened]="showItemDetails && media.isActive('gt-sm')"
    >
      <nbd-item-details></nbd-item-details>
    </mat-drawer>
    <mat-drawer-content>
      <div class="continueToRead">
        <nbd-items-section
          [label]="'Sist sett på'"
          [mediaTypeResults]="items"
          [showIfEmpty]="true"
          [isDebugOn]="isDebugOn"
          tabindex="0"
        ></nbd-items-section>
      </div>
      <nbd-items-section
        [label]="'Nye bøker'"
        [mediaTypeResults]="newBooks"
        [showMoreButton]="true"
        [isDebugOn]="isDebugOn"
        (mediaTypeChanged)="showMoreBooks.emit()"
        tabindex="0"
      ></nbd-items-section>
      <nbd-items-section
        [label]="'Nye aviser'"
        [mediaTypeResults]="newNewspapers"
        [showMoreButton]="true"
        [isDebugOn]="isDebugOn"
        (mediaTypeChanged)="showMoreNewspapers.emit()"
        tabindex="0"
      ></nbd-items-section>
      <nbd-items-section
        [label]="'Nye tidsskrift'"
        [mediaTypeResults]="newPeriodicals"
        [showMoreButton]="true"
        [isDebugOn]="isDebugOn"
        (mediaTypeChanged)="showMorePeriodicals.emit()"
        tabindex="0"
      ></nbd-items-section>
      <nbd-items-section
        [label]="'Nye bilder'"
        [mediaTypeResults]="newPhotos"
        [showMoreButton]="true"
        [isDebugOn]="isDebugOn"
        (mediaTypeChanged)="showMorePhotos.emit()"
        tabindex="0"
      ></nbd-items-section>
      <nbd-items-section
        [label]="'Andre nyheter'"
        [asList]="true"
        [mediaTypeResults]="newOthers"
        [isDebugOn]="isDebugOn"
        tabindex="0"
      ></nbd-items-section>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
