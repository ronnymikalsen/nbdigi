<div [ngClass]="currentTheme" class="nbd-container mat-app-background">
  <mat-toolbar class="app-header">
    <a class="brand" routerLink="/home" aria-label="NBDigi hjem">
      <mat-icon class="brand-logo" svgIcon="logo"></mat-icon>
      <span>NBDigi</span>
    </a>
  </mat-toolbar>

  <mat-sidenav-container class="main-container">
    @if (!mobileQuery.matches) {
    <mat-sidenav
      class="app-sidenav"
      mode="side"
      opened
      [disableClose]="true"
      aria-label="Hovednavigasjon"
    >
      <mat-nav-list aria-label="Hovednavigasjon">
        <a
          mat-list-item
          routerLink="/home"
          routerLinkActive="active"
          class="inactive"
        >
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle>Hjem</span>
        </a>
        <a
          mat-list-item
          routerLink="/explore"
          routerLinkActive="active"
          class="inactive"
        >
          <mat-icon matListItemIcon>explore</mat-icon>
          <span matListItemTitle>Utforsk</span>
        </a>
        <a
          mat-list-item
          routerLink="/search"
          routerLinkActive="active"
          class="inactive"
        >
          <mat-icon matListItemIcon>search</mat-icon>
          <span matListItemTitle>Søk</span>
        </a>
        <a
          mat-list-item
          routerLink="/mylibrary"
          routerLinkActive="active"
          class="inactive"
        >
          <mat-icon matListItemIcon>favorite</mat-icon>
          <span matListItemTitle>Mitt bibliotek</span>
        </a>
        <a
          mat-list-item
          routerLink="/myactivity"
          routerLinkActive="active"
          class="inactive"
        >
          <mat-icon matListItemIcon>person</mat-icon>
          <span matListItemTitle>Min aktivitet</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>
    }
    <mat-sidenav-content>
      <div class="content-column">
        <div class="main-content"><router-outlet></router-outlet></div>
        @if (mobileQuery.matches) {
        <mat-toolbar class="menu-toolbar">
          <div
            fxFill
            fxLayout="row"
            fxLayoutAlign="start center"
            fxLayoutAlign.lt-lg="space-between center"
            fxLayoutGap="16px"
          >
            <button
              routerLinkActive="active"
              mat-icon-button
              routerLink="/home"
              matTooltip="Hjem"
              aria-label="Hjem"
              class="inactive"
            >
              <mat-icon>home</mat-icon>
            </button>
            <button
              routerLinkActive="active"
              mat-icon-button
              routerLink="/explore"
              matTooltip="Utforsk"
              aria-label="Utforsk"
              class="inactive"
            >
              <mat-icon>explore</mat-icon>
            </button>
            <button
              routerLinkActive="active"
              mat-icon-button
              routerLink="/search"
              matTooltip="Søk"
              aria-label="Søk"
              class="inactive"
            >
              <mat-icon>search</mat-icon>
            </button>
            <button
              routerLinkActive="active"
              mat-icon-button
              routerLink="/mylibrary"
              matTooltip="Mitt bibliotek"
              aria-label="Mitt bibliotek"
              class="inactive"
            >
              <mat-icon>favorite</mat-icon>
            </button>
            <button
              routerLinkActive="active"
              mat-icon-button
              routerLink="/myactivity"
              matTooltip="Min aktivitet"
              aria-label="Min aktivitet"
              class="inactive"
            >
              <mat-icon>person</mat-icon>
            </button>
          </div>
        </mat-toolbar>
        }
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
