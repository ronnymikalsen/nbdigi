<div class="chart-container">
  @if (backDateOption) {
  <div class="chart-navigation">
    <button
      [disabled]="backDateOption.to === undefined"
      mat-icon-button
      [matTooltip]="
        'Utvid til ' +
        $safeNavigationMigration(backDateOption.date.viewValue?.toLowerCase())
      "
      (click)="back()"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
  </div>
  }
  @if ((years && years.length > 0) || (months && months.length > 0)) {
  <div class="chart-viewport">
    <ngx-charts-bar-vertical
      [results]="data"
      [scheme]="colorScheme"
      [xAxis]="true"
      [yAxis]="true"
      (select)="onSelect($event)"
    >
    </ngx-charts-bar-vertical>
  </div>
  }
</div>
