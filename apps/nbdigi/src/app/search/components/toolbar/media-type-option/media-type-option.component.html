<div
  class="mediatype-container"
  fxLayout="row"
  fxLayoutAlign="space-between center"
>
  <div class="checked">
    @if (checked) {
    <mat-icon>check</mat-icon>
    }
  </div>
  <div fxFlex="grow" class="mediaType">{{ mediaType }}</div>
  <mat-chip-set>
    <mat-chip class="count-chip">{{
      count | number: '' : 'nb_NO'
    }}</mat-chip>
  </mat-chip-set>
</div>
